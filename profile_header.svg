<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 340" width="100%" height="340">
  <style>
    @keyframes pulse {
      0% { opacity: 0.3; }
      50% { opacity: 0.9; }
      100% { opacity: 0.3; }
    }
    @keyframes glow {
      0% { filter: drop-shadow(0 0 2px #8b5cf6) drop-shadow(0 0 8px rgba(139, 92, 246, 0.3)); }
      50% { filter: drop-shadow(0 0 6px #a78bfa) drop-shadow(0 0 15px rgba(167, 139, 250, 0.6)); }
      100% { filter: drop-shadow(0 0 2px #8b5cf6) drop-shadow(0 0 8px rgba(139, 92, 246, 0.3)); }
    }
    @keyframes cursor-blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    @keyframes slide-in {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .bg { fill: #070913; }
    .grid { stroke: #1e1b4b; stroke-width: 0.5; opacity: 0.3; }
    .window-border { stroke: url(#border-grad); stroke-width: 1.5; fill: none; }
    .window-header { fill: #0b0f19; stroke: #1e293b; stroke-width: 0.5; }
    .title-main { font-family: 'System-UI', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; font-size: 34px; fill: url(#name-grad); animation: glow 4s infinite alternate; }
    .text-hello { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 16px; fill: #a5b4fc; }
    .text-desc { font-family: 'System-UI', sans-serif; font-size: 16px; fill: #94a3b8; }
    .code-key { fill: #f472b6; font-family: 'JetBrains Mono', monospace; font-size: 13px; }
    .code-val { fill: #38bdf8; font-family: 'JetBrains Mono', monospace; font-size: 13px; }
    .code-string { fill: #34d399; font-family: 'JetBrains Mono', monospace; font-size: 13px; }
    .code-comment { fill: #64748b; font-family: 'JetBrains Mono', monospace; font-size: 12px; font-style: italic; }
    .cursor { fill: #8b5cf6; animation: cursor-blink 1s infinite; }
    .bracket { fill: #fbbf24; font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: bold; }
    .animate-fade { animation: slide-in 1s ease-out forwards; }
  </style>

  <defs>
    <!-- Gradients -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="40%" stop-color="#8b5cf6" />
      <stop offset="80%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <linearGradient id="name-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#fb7185" />
    </linearGradient>
    <pattern id="grid-pattern" width="30" width-units="userSpaceOnUse" height="30" height-units="userSpaceOnUse" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" class="grid" />
    </pattern>
  </defs>

  <!-- Background and Grid -->
  <rect width="850" height="340" rx="14" class="bg" />
  <rect width="850" height="340" fill="url(#grid-pattern)" rx="14" />
  
  <!-- Window Outer Shell -->
  <rect x="15" y="15" width="820" height="310" rx="10" class="window-border" />
  
  <!-- Mac-Style Window Header -->
  <path d="M 16 25 Q 16 16 25 16 L 825 16 Q 834 16 834 25 L 834 50 L 16 50 Z" class="window-header" />
  
  <!-- Window Control Buttons -->
  <circle cx="35" cy="33" r="6" fill="#ef4444" />
  <circle cx="55" cy="33" r="6" fill="#f59e0b" />
  <circle cx="75" cy="33" r="6" fill="#10b981" />
  
  <!-- Window Title -->
  <text x="425" y="37" font-family="'JetBrains Mono', monospace" font-size="12" fill="#64748b" text-anchor="middle">abbas@itsolera: ~/profile</text>
  
  <!-- Console Status Dot -->
  <circle cx="810" cy="33" r="5" class="glow-dot" fill="#10b981" />
  <text x="795" y="37" font-family="'JetBrains Mono', monospace" font-size="11" fill="#10b981" text-anchor="end" style="animation: pulse 2s infinite;">LIVE SYSTEM</text>

  <!-- Left Side Contents: Brand Info -->
  <g transform="translate(45, 90)" class="animate-fade">
    <!-- Hello tag -->
    <text x="0" y="0" class="text-hello">&gt; hello_world.exe</text>
    
    <!-- Large Name -->
    <text x="0" y="45" class="title-main">Muhammad Abbas</text>
    
    <!-- Roles -->
    <text x="2" y="85" font-family="'JetBrains Mono', monospace" font-size="18" fill="#f8fafc" font-weight="bold">Full-Stack &amp; AI Integrator</text>
    
    <!-- Bio line -->
    <text x="2" y="115" class="text-desc">Crafting high-fidelity, intelligent web applications</text>
    <text x="2" y="135" class="text-desc">using the MERN Stack and LLM architectures.</text>
    
    <!-- Glowing button indicators (Visual Only) -->
    <rect x="2" y="170" width="135" height="30" rx="15" fill="#1e1b4b" stroke="#8b5cf6" stroke-width="1" />
    <text x="70" y="189" font-family="sans-serif" font-size="12" font-weight="bold" fill="#a5b4fc" text-anchor="middle">ITSOLERA Intern</text>

    <rect x="150" y="170" width="125" height="30" rx="15" fill="#18181b" stroke="#3f3f46" stroke-width="1" />
    <text x="212" y="189" font-family="sans-serif" font-size="12" font-weight="bold" fill="#a1a1aa" text-anchor="middle">BS IT Scholar</text>
  </g>

  <!-- Vertical Divider -->
  <line x1="480" y1="75" x2="480" y2="295" stroke="#1e293b" stroke-width="1" />

  <!-- Right Side Contents: Terminal Object Mockup -->
  <g transform="translate(510, 85)" class="animate-fade">
    <text x="0" y="0" class="code-comment">// Fetching developer state...</text>
    
    <!-- Code block -->
    <text x="0" y="25" class="bracket">const <text fill="#8b5cf6">developer</text> = <text fill="#fbbf24">{</text></text>
    
    <text x="20" y="50" class="code-key">name: <text class="code-string">"Muhammad Abbas"</text>,</text>
    <text x="20" y="75" class="code-key">stack: <text class="code-string">"MERN + FastAPI"</text>,</text>
    <text x="20" y="100" class="code-key">focus: <text class="code-string">"E-Commerce &amp; AI Agents"</text>,</text>
    <text x="20" y="125" class="code-key">currentWorkspace: <text class="code-string">"ITSOLERA Pvt Ltd"</text>,</text>
    <text x="20" y="150" class="code-key">aiModels: <text class="bracket">[</text><text class="code-string">"LLaMA 3.3"</text>, <text class="code-string">"Gemini"</text><text class="bracket">]</text>,</text>
    
    <text x="20" y="175" class="code-key">status: <text class="code-val">"ready_to_build"</text>,</text>
    <text x="20" y="200" class="code-key">coffeeLevel: <text class="code-val">100</text></text>
    
    <text x="0" y="225" class="bracket">};</text>

    <!-- Typing prompt simulator -->
    <text x="0" y="250" font-family="'JetBrains Mono', monospace" font-size="14" fill="#a5b4fc">&gt; system.run_engine() <rect x="175" y="238" width="8" height="15" class="cursor" /></text>
  </g>
</svg>
