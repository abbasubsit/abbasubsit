<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 300" width="100%" height="300">
  <style>
    @keyframes progress-fill {
      from { stroke-dashoffset: 100; }
      to { stroke-dashoffset: 0; }
    }
    @keyframes glow-pulse {
      0%, 100% { filter: drop-shadow(0 0 2px rgba(139, 92, 246, 0.4)); }
      50% { filter: drop-shadow(0 0 6px rgba(139, 92, 246, 0.8)) drop-shadow(0 0 10px rgba(99, 102, 241, 0.5)); }
    }
    .bg { fill: #070913; }
    .grid { stroke: #1e1b4b; stroke-width: 0.5; opacity: 0.3; }
    .outer-border { fill: none; stroke: #1e293b; stroke-width: 1; }
    .panel-bg { fill: #0b0f19; stroke: #1e293b; stroke-width: 1; rx: 8; }
    .panel-title { font-family: 'System-UI', -apple-system, sans-serif; font-size: 14px; font-weight: bold; fill: #a5b4fc; }
    .tech-label { font-family: 'JetBrains Mono', monospace; font-size: 12px; fill: #e2e8f0; }
    .bar-bg { fill: #1e293b; rx: 3; }
    .bar-fill-fe { fill: url(#fe-grad); rx: 3; }
    .bar-fill-be { fill: url(#be-grad); rx: 3; }
    .bar-fill-db { fill: url(#db-grad); rx: 3; }
    .bar-fill-ai { fill: url(#ai-grad); rx: 3; }
    .glowing-card { animation: glow-pulse 3s infinite alternate; }
  </style>

  <defs>
    <!-- Gradients for Tech Levels -->
    <linearGradient id="fe-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="be-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="db-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="ai-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#d946ef" />
    </linearGradient>
    <pattern id="grid-pattern" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" class="grid" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="850" height="300" rx="14" class="bg" />
  <rect width="850" height="300" fill="url(#grid-pattern)" rx="14" />
  <rect x="5" y="5" width="840" height="290" rx="10" class="outer-border" />

  <!-- PANEL 1: FRONTEND WIZARDRY (Top Left) -->
  <g transform="translate(25, 20)">
    <rect width="385" height="120" class="panel-bg" />
    <path d="M 12 15 L 18 10 L 24 15 M 18 10 L 18 24" fill="none" stroke="#8b5cf6" stroke-width="2" stroke-linecap="round" />
    <text x="35" y="20" class="panel-title">🎨 Frontend Wizardry</text>
    
    <!-- Skill 1: React & Redux -->
    <text x="20" y="50" class="tech-label">React / Redux</text>
    <rect x="150" y="42" width="200" height="6" class="bar-bg" />
    <rect x="150" y="42" width="185" height="6" class="bar-fill-fe" />
    
    <!-- Skill 2: Tailwind & MUI -->
    <text x="20" y="75" class="tech-label">Tailwind / MUI</text>
    <rect x="150" y="67" width="200" height="6" class="bar-bg" />
    <rect x="150" y="67" width="190" height="6" class="bar-fill-fe" />
    
    <!-- Skill 3: JavaScript / HTML5 -->
    <text x="20" y="100" class="tech-label">JavaScript (ES6)</text>
    <rect x="150" y="92" width="200" height="6" class="bar-bg" />
    <rect x="150" y="92" width="180" height="6" class="bar-fill-fe" />
  </g>

  <!-- PANEL 2: BACKEND POWER (Bottom Left) -->
  <g transform="translate(25, 155)">
    <rect width="385" height="120" class="panel-bg" />
    <rect x="10" y="10" width="14" height="14" fill="none" stroke="#10b981" stroke-width="2" />
    <text x="35" y="22" class="panel-title">⚙️ Backend Power</text>
    
    <!-- Skill 1: Node.js & Express -->
    <text x="20" y="50" class="tech-label">Node.js / Express</text>
    <rect x="150" y="42" width="200" height="6" class="bar-bg" />
    <rect x="150" y="42" width="180" height="6" class="bar-fill-be" />
    
    <!-- Skill 2: FastAPI / Python -->
    <text x="20" y="75" class="tech-label">FastAPI / Python</text>
    <rect x="150" y="67" width="200" height="6" class="bar-bg" />
    <rect x="150" y="67" width="150" height="6" class="bar-fill-be" />
    
    <!-- Skill 3: RESTful APIs & JWT -->
    <text x="20" y="100" class="tech-label">REST APIs / JWT</text>
    <rect x="150" y="92" width="200" height="6" class="bar-bg" />
    <rect x="150" y="92" width="185" height="6" class="bar-fill-be" />
  </g>

  <!-- PANEL 3: DATA & STORAGE (Top Right) -->
  <g transform="translate(440, 20)">
    <rect width="385" height="120" class="panel-bg" />
    <path d="M 12 12 L 24 12 L 24 24 L 12 24 Z M 18 12 L 18 24" fill="none" stroke="#f59e0b" stroke-width="2" />
    <text x="35" y="20" class="panel-title">💾 Data &amp; Storage</text>
    
    <!-- Skill 1: MongoDB & Mongoose -->
    <text x="20" y="50" class="tech-label">MongoDB &amp; Mongoose</text>
    <rect x="160" y="42" width="190" height="6" class="bar-bg" />
    <rect x="160" y="42" width="170" height="6" class="bar-fill-db" />
    
    <!-- Skill 2: MySQL / Schema Design -->
    <text x="20" y="75" class="tech-label">MySQL / Schema</text>
    <rect x="160" y="67" width="190" height="6" class="bar-bg" />
    <rect x="160" y="67" width="160" height="6" class="bar-fill-db" />
    
    <!-- Skill 3: Firebase / SQLite -->
    <text x="20" y="100" class="tech-label">Firebase / Relational</text>
    <rect x="160" y="92" width="190" height="6" class="bar-bg" />
    <rect x="160" y="92" width="145" height="6" class="bar-fill-db" />
  </g>

  <!-- PANEL 4: AI & WORKFLOWS (Bottom Right) -->
  <g transform="translate(440, 155)">
    <rect width="385" height="120" class="panel-bg glowing-card" />
    <circle cx="17" cy="17" r="7" fill="none" stroke="#ec4899" stroke-width="2" />
    <circle cx="17" cy="17" r="2" fill="#ec4899" />
    <text x="35" y="22" class="panel-title">🧠 AI &amp; Intelligent Workflows</text>
    
    <!-- Skill 1: Groq API & LLaMA 3.3 -->
    <text x="20" y="50" class="tech-label">Groq / LLaMA 3.3</text>
    <rect x="160" y="42" width="190" height="6" class="bar-bg" />
    <rect x="160" y="42" width="165" height="6" class="bar-fill-ai" />
    
    <!-- Skill 2: Gemini / HF Integrations -->
    <text x="20" y="75" class="tech-label">Gemini &amp; HuggingFace</text>
    <rect x="160" y="67" width="190" height="6" class="bar-bg" />
    <rect x="160" y="67" width="160" height="6" class="bar-fill-ai" />
    
    <!-- Skill 3: Prompt Eng & Automation -->
    <text x="20" y="100" class="tech-label">Prompt Engineering</text>
    <rect x="160" y="92" width="190" height="6" class="bar-bg" />
    <rect x="160" y="92" width="175" height="6" class="bar-fill-ai" />
  </g>
</svg>
